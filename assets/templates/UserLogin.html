{% extends 'base.html' %}
{% load static %}

{% block contents %}

<section class="login-section">
    <div class="container">
        <div class="login-card">
            <div class="login-header text-center">
                <img src="https://thumbs.dreamstime.com/b/secure-lock-cybersecurity-shield-sphere-glowing-icon-digital-data-protection-field-network-defense-online-vector-concept-337356704.jpg" alt="Secure Login - Digital Shield and Lock" class="secure-icon">
                <h2>User Login</h2>
                <p>Access your AI-generated cybersecurity policies securely</p>
            </div>

            <form action="{% url 'UserLoginCheck' %}" method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <input type="text" name="loginid" required id="loginid">
                    <label for="loginid">Login ID</label>
                </div>

                <div class="form-group">
                    <input type="password" name="pswd" required id="pswd">
                    <label for="pswd">Password</label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-login">Login</button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>

                {% if messages %}
                    <div class="messages">
                        {% for message in messages %}
                            <p class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="login-footer text-center">
                    <p>Don't have an account? <a href="{% url 'UserRegister' %}">Register here</a></p>
                </div>
            </form>
        </div>
    </div>
</section>

{% endblock %}
