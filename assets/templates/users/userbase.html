{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-Based Cybersecurity Policies and Procedures Platform">
    <title>AI-Based Cybersecurity Policies and Procedures</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --text-primary: #e0e7ff;
            --text-secondary: #94a3b8;
            --accent: #00ffea;
            --border: #1e293b;
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- HEADER ---------- */
        header {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1280px;
            margin: auto;
            padding: 0 1.5rem;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            gap: 1.8rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--accent);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        /* ---------- HERO ---------- */
        .hero {
            padding: 6rem 1.5rem;
            text-align: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0,255,234,0.12), transparent 70%);
        }

        .hero h1 {
            font-size: clamp(2.5rem, 7vw, 4rem);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .hero p {
            max-width: 900px;
            margin: auto;
            font-size: 1.15rem;
            color: var(--text-secondary);
            position: relative;
        }

        .highlight {
            color: var(--accent);
            font-weight: 600;
        }

        main {
            flex: 1;
        }

        /* ---------- FOOTER ---------- */
        footer {
            background: var(--bg-secondary);
            padding: 2rem 0;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
        }

        /* ---------- MOBILE ---------- */
        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }

            nav ul {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background: var(--bg-secondary);
                flex-direction: column;
                padding-top: 3rem;
                transition: left 0.4s ease;
            }

            nav ul.active {
                left: 0;
            }
        }
        /* TABLE CONTAINER */
.table-card {
    background: rgba(17, 24, 39, 0.9);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
    box-shadow: 0 10px 35px rgba(0, 255, 234, 0.1);
    overflow-x: auto;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
    color: var(--text-primary);
}

/* HEADER */
table th {
    background: linear-gradient(135deg, #00ffea, #00b8a9);
    color: #0a0e17;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 14px;
    border-bottom: 2px solid var(--border);
}

/* CELLS */
table td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
}

/* ROW EFFECTS */
table tr {
    transition: background 0.3s ease;
}

table tr:nth-child(even) {
    background: rgba(30, 41, 59, 0.6);
}

table tr:hover {
    background: rgba(0, 255, 234, 0.08);
}

/* RESPONSIVE */
.table-responsive {
    width: 100%;
    overflow-x: auto;
}

/* GPT TEST CARD */
.gpt-card {
    max-width: 900px;
    margin: 2.5rem auto;
    background: rgba(17, 24, 39, 0.9);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 2.5rem;
    box-shadow: 0 20px 50px rgba(0, 255, 234, 0.15);
}

/* INFO CARD */
.info-card {
    max-width: 900px;
    margin: 2rem auto;
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
}

.info-card h3 {
    color: var(--accent);
    margin-bottom: 1rem;
}

.info-card ol {
    color: var(--text-secondary);
    padding-left: 1.5rem;
}

.info-card code {
    color: var(--accent);
}

/* TEXTAREA FIX */
.form-group textarea {
    width: 100%;
    min-height: 140px;
    resize: vertical;
}

/* SMALLER API KEY BOX */
.form-group textarea[name="API_KEY"] {
    min-height: 70px;
}


    </style>
</head>

<body>

<header>
    <div class="container header-inner">
        <a href="{% url 'UserHome' %}" class="logo">AI-Based Cybersecurity Policies & Procedures</a>

        <button class="mobile-menu-btn"
                onclick="document.querySelector('nav ul').classList.toggle('active')">
            ☰
        </button>

        <nav>
            <ul>
                <li><a href="{% url 'UserHome' %}">Home</a></li>
                <li><a href="{% url 'ViewDataset' %}">Dataset</a></li>
                <li><a href="{% url 'cyResults' %}">Results</a></li>
                <li><a href="{% url 'GPTTest' %}">GPT</a></li>
                <li><a href="{% url 'index' %}">Logout</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    

    {% block contents %}
    {% endblock %}
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 Alex Corporation. All Rights Reserved.</p>
    </div>
</footer>

<script>
    document.querySelectorAll('nav a').forEach(link => {
        link.addEventListener('click', () => {
            document.querySelector('nav ul').classList.remove('active');
        });
    });
</script>

</body>
</html>
