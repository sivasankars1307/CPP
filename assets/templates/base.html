{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-Based Cybersecurity Policies and Procedures Platform">
    <title>AI-Based Cybersecurity Policies and Procedures</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        .content-section {
    padding: 4rem 0;
    background: var(--bg-secondary);
}

.content-section h2 {
    text-align: center;
    font-size: clamp(2rem, 5vw, 3rem);
    margin-bottom: 1.5rem;
    color: var(--accent);
}

.intro-text {
    max-width: 900px;
    margin: 0 auto 2rem;
    text-align: center;
    font-size: 1.1rem;
}

.intro-image {
    text-align: center;
    margin: 2rem 0;
}

.intro-image img {
    max-width: 100%;
    height: auto;
    border-radius: var(--radius);
    box-shadow: 0 4px 20px rgba(0, 255, 234, 0.1);
}

.cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 2rem;
    margin-top: 3rem;
}

.card {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    transition: var(--transition);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 30px rgba(0, 255, 234, 0.15);
    border-color: var(--accent);
}

.card img {
    width: 100%;
    height: auto;
    border-radius: var(--radius);
    margin-bottom: 1.5rem;
    object-fit: contain;
    background: #0f172a;
}

.card h3 {
    font-size: 1.5rem;
    margin: 0 0 1rem;
    color: var(--accent);
}

.card p {
    margin: 0.5rem 0;
}
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --text-primary: #e0e7ff;
            --text-secondary: #94a3b8;
            --accent: #00ffea; /* Cyan neon */
            --accent-hover: #00b8a9;
            --border: #1e293b;
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 2rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        nav a:hover, nav a:focus {
            color: var(--accent);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 6rem 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 234, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin: 0 0 1.5rem;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .hero p {
            max-width: 800px;
            margin: 0 auto 2rem;
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            color: var(--text-secondary);
        }

        .hero .highlight {
            color: var(--accent);
            font-weight: 600;
        }

        main {
            flex: 1;
        }

        footer {
            background: var(--bg-secondary);
            padding: 2rem 0;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }
            nav ul {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background: var(--bg-secondary);
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                padding-top: 3rem;
                transition: left 0.4s ease;
            }

            nav ul.active {
                left: 0;
            }

            nav li {
                margin: 1rem 0;
            }
        }

        .login-section {
    padding: 6rem 0;
    min-height: calc(100vh - 140px); /* Adjust for header/footer */
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, rgba(10, 14, 23, 0.9), rgba(17, 24, 39, 0.95));
}

.login-card {
    max-width: 420px;
    margin: 0 auto;
    background: rgba(17, 24, 39, 0.8);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3rem 2.5rem;
    box-shadow: 0 10px 40px rgba(0, 255, 234, 0.1);
    backdrop-filter: blur(12px);
}

.login-header h2 {
    font-size: 2.2rem;
    margin: 1rem 0 0.5rem;
    color: var(--accent);
}

.login-header p {
    color: var(--text-secondary);
    margin-bottom: 2rem;
}

.secure-icon {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--accent);
    box-shadow: 0 0 20px rgba(0, 255, 234, 0.3);
    margin-bottom: 1rem;
}

.form-group {
    position: relative;
    margin-bottom: 2rem;
}

.form-group input {
    width: 100%;
    padding: 1rem 0 0.5rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--text-secondary);
    color: var(--text-primary);
    font-size: 1.1rem;
    transition: border-color 0.3s ease;
}

.form-group input:focus {
    outline: none;
    border-color: var(--accent);
}

.form-group label {
    position: absolute;
    top: 1rem;
    left: 0;
    color: var(--text-secondary);
    font-size: 1.1rem;
    pointer-events: none;
    transition: all 0.3s ease;
}

.form-group input:focus ~ label,
.form-group input:valid ~ label {
    top: 0.2rem;
    font-size: 0.85rem;
    color: var(--accent);
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin: 2rem 0;
}


/* Support textarea in floating labels */
.form-group textarea {
    width: 100%;
    padding: 1.5rem 0 0.5rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--text-secondary);
    color: var(--text-primary);
    font-size: 1.1rem;
    transition: border-color 0.3s ease;
    resize: vertical;
    min-height: 100px;
}

.form-group textarea:focus {
    outline: none;
    border-color: var(--accent);
}

.form-group textarea:focus ~ label,
.form-group textarea:valid ~ label {
    top: 0.2rem;
    font-size: 0.85rem;
    color: var(--accent);
}

/* Ensure all inputs have required for :valid to trigger on fill */
.form-group input:valid ~ label,
.form-group textarea:valid ~ label {
    top: 0.2rem;
    font-size: 0.85rem;
    color: var(--accent);
}

.form-group textarea:focus {
    outline: none;
    border-color: var(--accent);
}



.btn-login, .btn-reset {
    flex: 1;
    padding: 1rem;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
}

.btn-login {
    background: var(--accent);
    color: #0a0e17;
}

.btn-login:hover {
    background: #00e0d0;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0, 255, 234, 0.3);
}

.btn-reset {
    background: transparent;
    border: 2px solid var(--border);
    color: var(--text-secondary);
}

.btn-reset:hover {
    border-color: var(--accent);
    color: var(--accent);
}

.messages p {
    text-align: center;
    padding: 1rem;
    border-radius: 8px;
    margin: 1rem 0;
}

.messages p.success { background: rgba(0, 255, 100, 0.15); color: #00ff9d; }
.messages p.error { background: rgba(255, 50, 50, 0.15); color: #ff6b6b; }

.login-footer a {
    color: var(--accent);
    text-decoration: none;
}

.login-footer a:hover {
    text-decoration: underline;
}



    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="{% url 'index' %}" class="logo">AI-Based Cybersecurity Policies and Procedures</a>
            <button class="mobile-menu-btn" aria-label="Toggle menu" onclick="document.querySelector('nav ul').classList.toggle('active')">
                ☰
            </button>
            <nav>
                <ul>
                    <li><a href="{% url 'index' %}">Home</a></li>
                    <li><a href="{% url 'UserLogin' %}">User</a></li>
                    <li><a href="{% url 'AdminLogin' %}">Admin</a></li>
                    <li><a href="{% url 'UserRegister' %}">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>
    {% block contents %}
    {% endblock %}

    <footer>
        <div class="container">
            <p>&copy; 2026 Alex Corporation. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // Simple mobile menu close on link click
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('nav ul').classList.remove('active');
            });
        });
    </script>
</body>
</html>
